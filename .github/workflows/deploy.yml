# Builds the site and publishes it to GitHub Pages (gh-pages branch) on every push to main.
# Live URL: https://infoglixy-boop.github.io/glixy-cloth-frontend/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for the /glixy-cloth-frontend/ sub-path
        run: npx tsc -b && npx vite build --base=/glixy-cloth-frontend/

      - name: SPA fallback so deep links (/trust, /ai …) load the app
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # Root-path build for glixy.in on Hostinger. hPanel → Advanced → Git pulls this branch into public_html.
      - name: Build for glixy.in (served from the domain root)
        run: npx vite build --base=/ --outDir dist-root

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-root
          publish_branch: hostinger
          force_orphan: true
