<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glixy — Dedicated Servers, GPU Racks &amp; Colocation</title>
    <meta name="description" content="Glixy provisions dedicated servers, GPU racks and colocation slots for businesses and individuals. Pick your rack, talk to an expert, go live." />
    <meta name="theme-color" content="#fffaf5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..600&family=Inter:opsz,wght@14..32,300..700&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/782a4a52-4c1e-4471-bb0c-aa232927f4a6.webp" />
    <style>
      /* boot splash: shown until the app and fonts are ready */
      #boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#fffaf5;transition:opacity .6s cubic-bezier(.2,.8,.2,1),visibility .6s}
      #boot.is-out{opacity:0;visibility:hidden}
      #boot .bw{display:grid;justify-items:center;gap:26px}
      #boot svg{width:min(260px,62vw);height:auto;overflow:visible}
      #boot .ink{fill:none;stroke:#ff6b0d;stroke-width:16}
      #boot .g{stroke-dasharray:1;stroke-dashoffset:1;animation:bg-draw .9s cubic-bezier(.65,0,.25,1) .1s forwards}
      #boot .l{opacity:0;translate:var(--f) 0;animation:bg-l .62s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
      #boot .dx{translate:-126px 0;animation:bg-dx .62s cubic-bezier(.3,.7,.25,1) 1s forwards}
      #boot .dy{animation:bg-dy .62s 1s both}
      #boot circle{fill:#ff6b0d}
      #boot .bar{width:min(220px,56vw);height:3px;border-radius:3px;background:#ffe8d6;overflow:hidden}
      #boot .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#f04d0c,#ff8a2b);animation:bg-bar 1.1s ease-in-out infinite}
      #boot p{margin:0;font:600 11px/1 'Inter Tight',Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c2410c}
      @keyframes bg-draw{to{stroke-dashoffset:0}}
      @keyframes bg-l{to{opacity:1;translate:0 0}}
      @keyframes bg-dx{to{translate:0 0}}
      @keyframes bg-dy{0%{translate:0 -2px}45%{translate:0 -30px}80%{translate:0 0}88%{translate:0 -3px}100%{translate:0 0}}
      @keyframes bg-bar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}#boot .g{stroke-dashoffset:0}#boot .l{opacity:1;translate:0 0}#boot .dx{translate:0 0}}
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Glixy">
      <div class="bw">
        <svg viewBox="-4 -4 540 108" aria-hidden="true">
          <path class="ink g" pathLength="1" d="M93.5 25.9A47 42 0 1 0 102 50H62" />
          <g class="l" style="--f:-36px;--d:.55s"><path class="ink" d="M144 0V92H214" /></g>
          <g class="l" style="--f:-140px;--d:.6s"><path class="ink" d="M248 32V100" /></g>
          <g class="l" style="--f:-200px;--d:.65s"><path class="ink" d="M293 0L381 100M381 0L293 100" /></g>
          <g class="l" style="--f:-330px;--d:.7s"><path class="ink" d="M428 0L473 52L518 0M473 52V100" /></g>
          <g class="dx"><g class="dy"><circle cx="248" cy="12" r="10" /></g></g>
        </svg>
        <div class="bar"><i></i></div>
        <p>Racking your servers</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
